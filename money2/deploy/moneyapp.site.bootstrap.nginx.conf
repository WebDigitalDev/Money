server {
    listen 80;
    listen [::]:80;
    server_name moneyapp.site www.moneyapp.site;

    root /home/money/money2/web;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
