spring.application.name=money2

server.address=${MONEY2_BIND_ADDRESS:127.0.0.1}
server.port=${MONEY2_PORT:8081}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${MONEY2_DB_URL}
spring.datasource.username=${MONEY2_DB_USERNAME}
spring.datasource.password=${MONEY2_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=Money2Pool
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

spring.jpa.hibernate.ddl-auto=none
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=20MB
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Cuiaba
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

spring.jackson.default-property-inclusion=non_null

money.security.jwt-secret=${MONEY2_JWT_SECRET}
money.security.token-validity-hours=${MONEY2_TOKEN_VALIDITY_HOURS:12}
money.documents.storage-path=${MONEY2_DOCUMENT_STORAGE:/home/money/money2/data/clientes/documentos}
money.documents.legacy-storage-path=${MONEY2_LEGACY_DOCUMENT_STORAGE:/home/money/moneyapp/data/clientes/documentos}
money.collections.storage-path=${MONEY2_COLLECTION_STORAGE:/home/money/money2/data/cobrancas/anexos}
money.integrations.sicredi-storage-path=${MONEY2_SICREDI_STORAGE:/home/money/money2/data/sicredi/certificados}
money.cors.allowed-origin-patterns=${MONEY2_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://money.hartenberger.dev,https://api.moneymt.com.br,https://moneyapp.site,https://www.moneyapp.site}
money.qdrant.enabled=${MONEY2_QDRANT_ENABLED:false}
money.qdrant.url=${MONEY2_QDRANT_URL:http://127.0.0.1:6333}
money.qdrant.api-key=${MONEY2_QDRANT_API_KEY:}
money.qdrant.collection=${MONEY2_QDRANT_COLLECTION:money2_clients}
money.qdrant.sync-delay-ms=${MONEY2_QDRANT_SYNC_DELAY_MS:300000}
money.qdrant.financial-collection=${MONEY2_QDRANT_FINANCIAL_COLLECTION:money2_financial_context}
money.qdrant.financial-sync-delay-ms=${MONEY2_QDRANT_FINANCIAL_SYNC_DELAY_MS:300000}
money.codex.enabled=${MONEY2_CODEX_ENABLED:false}
money.codex.executable=${MONEY2_CODEX_EXECUTABLE:codex}
money.codex.data-directory=${MONEY2_CODEX_DATA_DIRECTORY:/home/money/money2/data/codex}
money.codex.request-timeout-seconds=${MONEY2_CODEX_REQUEST_TIMEOUT_SECONDS:180}
money.codex.max-processes=${MONEY2_CODEX_MAX_PROCESSES:12}
money.codex.idle-minutes=${MONEY2_CODEX_IDLE_MINUTES:20}

logging.level.root=INFO
logging.level.com.webdigital.money2=INFO
