plugins {
    id 'com.android.library'
}

group = 'com.flutterplaza.no_screenshot'
version = '1.0-SNAPSHOT'

android {
    namespace = "com.flutterplaza.no_screenshot"
    compileSdk = 37

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // NOTE: do not add src/main/kotlin to sourceSets here — the Kotlin
    // toolchain (KGP, and AGP's built-in Kotlin on 9+) already compiles it,
    // and registering it again compiles every declaration twice
    // ("Conflicting declarations" on Flutter >= 3.44.4, see #114).

    defaultConfig {
        minSdk = 24
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
